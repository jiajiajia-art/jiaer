<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字RPG游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- 顶部导航栏 -->
        <header class="game-header">
            <h1>文字RPG游戏</h1>
            <div class="header-buttons">
                <button id="sceneBtn" class="nav-btn active">场景</button>
                <button id="mapBtn" class="nav-btn">大地图</button>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 场景面板 -->
            <div id="scenePanel" class="panel active">
                <div class="panel-header">
                    <h2 id="sceneTitle">当前场景</h2>
                    <button id="triggerSceneEventBtn" class="scene-event-btn">📜 奇闻轶事</button>
                </div>
                <!-- 游戏时间栏 -->
                <div class="game-time-bar">
                    <span class="time-icon">🕐</span>
                    <span id="gameTimeDisplay" class="game-time-text">加载中...</span>
                </div>
                <div class="scene-content">
                    
                   
                    <div class="scene-hero">
                        <div class="scene-visual">
                            <img id="sceneImage" src="" alt="场景图片">
                        </div>
                        <div class="scene-description">
                            <p id="sceneDescription">欢迎来到文字RPG世界！</p>
                        </div>
                    </div>
                    <div class="scene-buildings">
                        <h3>建筑</h3>
                        <div id="buildingsList" class="buildings-grid">
                            <!-- 建筑将通过JavaScript动态生成 -->
                        </div>
                    </div>
                    <div class="scene-npcs">
                        <h3>NPC</h3>
                        <div id="npcsList" class="npcs-grid">
                            <!-- NPC将通过JavaScript动态生成 -->
                        </div>
                    </div>
                    <div class="scene-exits">
                        <h3>场景出口</h3>
                        <div id="exitsList" class="exits-grid">
                            <!-- 场景出口将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 大地图面板 -->
            <div id="mapPanel" class="panel">
                <div class="panel-header">
                    <h2>大地图</h2>
                    <button id="resetMapView" class="reset-map-btn">重置视图</button>
                </div>
                <div class="map-content">
                    <svg id="mapSvg" class="map-svg" viewBox="0 0 1000 800">
                        <!-- 连接线层 -->
                        <g id="mapConnections"></g>
                        <!-- 场景节点层 -->
                        <g id="mapNodes"></g>
                    </svg>
                </div>
            </div>
        </main>

        <!-- 事件弹窗 -->
        <div id="eventModal" class="modal">
            <div class="modal-content">
                <div class="event-image">
                    <img id="eventImage" src="" alt="事件图片">
                </div>
                <div class="event-description">
                    <p id="eventText"></p>
                </div>
                <div class="event-options">
                    <button id="option1" class="event-option"></button>
                    <button id="option2" class="event-option"></button>
                    <button id="option3" class="event-option"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮聊天面板 -->
    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <h3 id="chatTitle">聊天</h3>
            <button id="closeChatBtn" class="close-chat-btn">×</button>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="chat-message system">欢迎来到游戏世界！</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="输入消息...">
            <button id="sendChatBtn" class="send-chat-btn">发送</button>
        </div>
    </div>

    <!-- 悬浮背包面板 -->
    <div id="inventoryFloatingPanel" class="inventory-floating-panel">
        <div class="inventory-panel-header">
            <h3>背包</h3>
            <button id="closeInventoryBtn" class="close-inventory-btn">×</button>
        </div>
        <div class="inventory-panel-content">
            <!-- 装备区域 -->
            <div class="equipment-section">
                <h3>装备</h3>
                <div class="equipment-grid">
                    <div class="equipment-slot" data-slot="head">
                        <img src="data/icons/empty.png" alt="头部">
                        <span>头部</span>
                    </div>
                    <div class="equipment-slot" data-slot="body">
                        <img src="data/icons/empty.png" alt="上身">
                        <span>上身</span>
                    </div>
                    <div class="equipment-slot" data-slot="legs">
                        <img src="data/icons/empty.png" alt="下身">
                        <span>下身</span>
                    </div>
                    <div class="equipment-slot" data-slot="hands">
                        <img src="data/icons/empty.png" alt="手部">
                        <span>手部</span>
                    </div>
                    <div class="equipment-slot" data-slot="feet">
                        <img src="data/icons/empty.png" alt="脚部">
                        <span>脚部</span>
                    </div>
                    <div class="equipment-slot" data-slot="back">
                        <img src="data/icons/empty.png" alt="背部">
                        <span>背部</span>
                    </div>
                    <div class="equipment-slot" data-slot="leftHand">
                        <img src="data/icons/empty.png" alt="左手武器">
                        <span>左手</span>
                    </div>
                    <div class="equipment-slot" data-slot="rightHand">
                        <img src="data/icons/empty.png" alt="右手武器">
                        <span>右手</span>
                    </div>
                </div>
            </div>
            <!-- 物品区域 -->
            <div class="items-section">
                <h3>物品</h3>
                <div id="itemsGrid" class="items-grid">
                    <!-- 物品将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮角色信息面板 -->
    <div id="playerFloatingPanel" class="player-floating-panel">
        <div class="player-panel-header">
            <h3>角色信息</h3>
            <button id="closePlayerBtn" class="close-player-btn">×</button>
        </div>
        <div class="player-panel-content">
            <div class="player-info">
                <div class="player-avatar">
                    <img id="playerAvatar" src="data/avatars/default.png" alt="角色头像">
                </div>
                <div class="player-details">
                    <div class="player-basic">
                        <h3 id="playerName">未命名</h3>
                        <p><span class="label">年龄:</span> <span id="playerAge">-</span></p>
                        <p><span class="label">性别:</span> <span id="playerGender">-</span></p>
                        <p><span class="label">职业:</span> <span id="playerJob">-</span></p>
                    </div>
                    <div class="player-stats">
                        <h4>属性</h4>
                        <div class="stat-bar">
                            <span class="stat-label">等级:</span>
                            <span id="playerLevel" class="stat-value">1</span>
                        </div>
                        <div class="stat-bar">
                            <span class="stat-label">生命:</span>
                            <span id="playerHealth" class="stat-value">100/100</span>
                        </div>
                        <div class="stat-bar">
                            <span class="stat-label">攻击:</span>
                            <span id="playerAttack" class="stat-value">10</span>
                        </div>
                        <div class="stat-bar">
                            <span class="stat-label">防御:</span>
                            <span id="playerDefense" class="stat-value">5</span>
                        </div>
                        <div class="stat-bar">
                            <span class="stat-label">速度:</span>
                            <span id="playerSpeed" class="stat-value">8</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 场景详情弹窗 -->
    <div id="sceneDetailModal" class="modal">
        <div class="modal-content scene-modal-content">
            <button class="close-scene-modal">×</button>
            <div class="scene-detail-image">
                <img id="sceneDetailImage" src="" alt="场景图片">
            </div>
            <div class="scene-detail-info">
                <h2 id="sceneDetailName">场景名称</h2>
                <div class="scene-detail-description">
                    <p id="sceneDetailDesc">场景描述</p>
                </div>
                <div class="scene-travel-cost">
                    <div class="cost-info">
                        <span class="cost-label">旅行费用：</span>
                        <span id="travelCost" class="cost-value">10</span>
                        <span class="cost-icon">💰</span>
                    </div>
                    <div class="player-gold">
                        <span class="gold-label">你的金币：</span>
                        <span id="playerGoldDisplay" class="gold-value">100</span>
                        <span class="gold-icon">💰</span>
                    </div>
                </div>
                <div class="scene-detail-actions">
                    <button id="goToSceneBtn" class="go-to-scene-btn">🚀 前往此场景</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NPC详情弹窗 -->
    <div id="npcModal" class="modal">
        <div class="modal-content npc-modal-content">
            <button class="close-npc-modal">×</button>
            <div class="npc-detail-header">
                <img id="npcDetailAvatar" src="" alt="NPC头像" class="npc-detail-avatar">
                <div class="npc-detail-info">
                    <h2 id="npcDetailName">NPC姓名</h2>
                    <div class="npc-detail-stats">
                        <span class="npc-detail-job" id="npcDetailJob">职业</span>
                        <span class="npc-detail-gender" id="npcDetailGender">性别</span>
                        <span class="npc-detail-age" id="npcDetailAge">年龄</span>
                    </div>
                </div>
            </div>
            <div class="npc-detail-description">
                <p id="npcDetailDesc">描述</p>
            </div>
            <div class="npc-relationships">
                <h3>人际关系</h3>
                <div id="npcRelationshipsList" class="relationships-grid">
                    <!-- 关系列表动态生成 -->
                </div>
            </div>
            <div class="npc-actions">
                <button id="chatWithNPCBtn" class="chat-with-npc-btn">💬 与TA对话</button>
            </div>
        </div>
    </div>

    <!-- 悬浮世界观面板 -->
    <div id="lorePanel" class="lore-floating-panel">
        <div class="lore-panel-header">
            <h3>世界观</h3>
            <button id="closeLoreBtn" class="close-lore-btn">×</button>
        </div>
        <div class="lore-panel-content">
            <div class="lore-section">
                <h4>📖 世界背景</h4>
                <div id="worldLoreContent" class="lore-content">
                    <!-- 世界背景故事 -->
                </div>
            </div>
            <div class="lore-section">
                <h4>⚔️ 主角故事</h4>
                <div id="playerLoreContent" class="lore-content">
                    <!-- 玩家主角故事 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮按钮组 -->
    <button id="toggleLoreBtn" class="floating-lore-btn" title="世界观">📖</button>
    <button id="togglePlayerBtn" class="floating-player-btn" title="角色信息">👤</button>
    <button id="toggleInventoryBtn" class="floating-inventory-btn" title="打开背包">🎒</button>
    <button id="toggleChatBtn" class="floating-chat-btn" title="打开聊天">💬</button>

    <script src="js/game.js"></script>
    <script src="js/player.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/event.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
