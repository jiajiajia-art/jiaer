# —— 交涉结果：不是「看到卡就能接」。参数在此，判定在引擎 ——
negotiation:
  standbyBonus: 12      # 候补资格：下次交涉同一通告的成功率加成
  formalMargin: 25      # roll ≤ rate-该值 → 正式过；否则接取偏弱
  waitMargin: 15        # 失败但 roll ≤ rate+该值 → 尚有候补/等待余地
  standbyTrust: 30      # 信任≥该值时给候补资格，否则仅等待通知
  snatchChance: 0.35    # 直接拒绝时通告被同期艺人抢走的概率
  outcomes:
    formal:    { label: 试镜通过, payMul: 1.0,  fameMul: 1.0, note: "" }
    lowprice:  { label: 低价出演, payMul: 0.75, fameMul: 1.0, note: 报酬缩水，但先站住位置 }
    downgrade: { label: 角色降级, payMul: 0.85, fameMul: 0.7, note: 戏份被砍，成长与曝光打折 }
    standby:   { label: 候补资格, payMul: 1.0,  fameMul: 1.0, note: 暂列候补，下次交涉更有把握 }
    wait:      { label: 等待通知, payMul: 1.0,  fameMul: 1.0, note: 负责人让你回去等消息 }
    reject:    { label: 直接拒绝, payMul: 1.0,  fameMul: 1.0, note: 这次没能谈成 }
