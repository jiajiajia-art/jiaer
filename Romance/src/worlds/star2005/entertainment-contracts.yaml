# ═══════════════════════════════════════════════════════════════
#  星光2005 · 通告/合同内容池 (entertainment-contracts)
#  这里存放「项目性质」分类、每张通告的性质与隐藏取舍，以及交涉结果的
#  文案与调参。数值本体（报酬/门槛/档期/成长）暂仍在 data.ts:GIG_POOL，
#  后续可整体迁入本文件的 templates 段。引擎只读参数、做裁决，不写中文。
# ═══════════════════════════════════════════════════════════════

# —— 项目性质（明星志愿式）：决定这张卡的「用途」与取舍 ——
natures:
  - { id: commercial, label: 商业通告, hint: 现金流快、易占重要档期 }
  - { id: drama,      label: 戏剧通告, hint: 演技成长与代表作、周期长 }
  - { id: music,      label: 音乐通告, hint: 歌艺与原创线、前期销量不稳 }
  - { id: variety,    label: 综艺通告, hint: 名气口才爆发、压力高易露怯 }
  - { id: promo,      label: 宣传活动, hint: 维护曝光、收益低 }
  - { id: special,    label: 特殊限时, hint: 限时高回报、门槛与代价俱高 }
  - { id: personal,   label: 个人事件, hint: 剧情驱动、收益独特 }

# —— 按通告 id 附加性质与隐藏取舍（对应 GIG_POOL）——
meta:
  g1: { nature: commercial, tradeoff: 占掉本周电视剧试镜档期 }
  g2: { nature: drama,      tradeoff: 片酬低、拍摄周期长 }
  g3: { nature: music,      tradeoff: 团体单曲、前期销量不稳 }
  g4: { nature: variety,    tradeoff: 压力高、容易暴露短板 }
  g5: { nature: commercial, tradeoff: 门槛高、吃掉重要档期 }
  g6: { nature: drama,      tradeoff: 周期最长、失败代价大 }
  g7: { nature: special,    tradeoff: 门槛极高、失败会拖垮口碑 }
  g8: { nature: music,      tradeoff: 投入大、销量回报不稳定 }

# —— 开局候选经纪合约（三份，偏影视/音乐/商业）——
