# ═══ 游戏资料库 · help 文档（内容池）═══
# NPC 与主持人据此回答"游戏机制 / 世界设定"类提问，避免凭空编造规则。
# 全部中文与设定留在此文件；引擎（kb.ts）只做检索打分，不写死任何词条。
# keywords 为检索命中词；body 为可直接引用的准确说明。

intro: >-
  以下是与本作玩法/世界设定相关的资料。回答规则、数值、地点、时代设定这类问题时，
  只依据这些资料作答，不要编造不存在的机制或数字；与资料无关的闲聊照常自由发挥。

era: >-
  故事发生在 2005—2006 年的华语娱乐圈。那是短信选秀、打榜、报刊娱乐版与门户网站
  当红的年代——没有智能手机与短视频，宣发靠电视通告、平面杂志、签售与传统媒体。

docs:
  - id: era
    title: 时代背景（2005—2006）
    keywords: [年代, 时代, 背景, 2005, 2006, 现在几几年, 什么时候, 手机, 网络]
    body: >-
      本作设定在 2005 至 2006 年的现代娱乐圈。宣传以电视通告、平面杂志、签售会与门户
      网站为主，选秀与短信投票盛行。不要出现智能手机、短视频、直播带货等更晚出现的事物。

  - id: fame
    title: 名气与咖位
    keywords: [名气, 咖位, 出名, 人气, 星级, 几线, 红不红, 粉丝数]
    body: >-
      名气衡量你在圈内外的知名度（上限 1000），越高越能接到高星级通告、拿到更高报价。
      名气随作品、通告、公开露面与话题度积累，也可能因争议受损。名气达到一定值会解锁
      公开人设与舆情经营。

  - id: reputation
    title: 口碑
    keywords: [口碑, 风评, 名声, 业内评价, 专业口碑]
    body: >-
      口碑（0—100）代表业内与观众对你专业度、人品的评价。口碑影响选角信任、危机结算
      与奖项观众票。踏实演戏、诚恳处理危机能提升口碑；耍大牌、翻车会拉低它。

  - id: stress
    title: 压力
    keywords: [压力, 心态, 崩溃, 疲惫, 休息]
    body: >-
      压力（0—100）过高会影响状态与表现。高强度通告、危机会累积压力；与人私下联系、
      恋人陪伴、适度休息可以缓解压力。

  - id: energy
    title: 行动力
    keywords: [行动力, 精力, 体力, 行动点, 累, 度日]
    body: >-
      行动力（0—100）是每次行动的消耗资源。出行、探索、私下联系、安排公开内容都要花
      行动力。通过"时辰盘度日/推进"可以恢复行动力并让世界进入下一天。

  - id: money
    title: 资金
    keywords: [钱, 资金, 收入, 报酬, 片酬, 代言费, 现金]
    body: >-
      资金以人民币"元"计。通告报酬、代言、签约金带来收入；交通、公关私下和解等会花钱。
      金额一律为整数，剧情不会凭空发放大额资金。

  - id: gig
    title: 通告全流程（投递·试镜·签约·拍摄）
    keywords: [通告, 投递, 试镜, 签约, 拍摄, 接戏, 角色, 项目, 剧组]
    body: >-
      接通告分四步：先向片场负责人当面洽谈、逐项问清项目信息；投递并通过试镜；签约；
      再按拍摄日安排开拍。星级越高的项目要求越苛刻、报酬也越高。

  - id: producer
    title: 洽谈通告与负责人
    keywords: [制作人, 制片人, 负责人, 洽谈, 打听项目, 经纪]
    body: >-
      通告掌握在各公司/剧组负责人手里。要到对方所在地点当面"洽谈通告"，逐步追问才能
      解锁项目的类型、角色、截止周、剧情等字段；问到的信息会归档进你的资料袋。

  - id: schedule
    title: 养成与日程
    keywords: [养成, 日程, 训练, 修习, 属性, 八维, 提升能力, 上课]
    body: >-
      养成通过每日日程推进：安排训练可提升八维能力（如台词、镜头、舞蹈等）。能力越高，
      试镜与拍摄表现越好。训练消耗行动力，需要在度日中逐步积累。

  - id: persona
    title: 公开人设
    keywords: [人设, 形象, 标签, 邻家, 冷感, 实力, 甜酷, 知性, 立人设]
    body: >-
      名气破圈后可公开人设标签（邻家/冷感/实力/甜酷/知性等）。持续发布与人设一致的公开
      内容会提升品牌匹配度与目标受众认可；频繁反转人设会推高争议、增加脱粉风险。

  - id: crisis
    title: 舆情危机与公关
    keywords: [危机, 舆情, 公关, 黑料, 翻车, 绯闻, 道歉, 澄清, 热搜]
    body: >-
      争议累积到阈值会触发危机。你需在沉默、道歉、举证、反击、私下和解中选一项。结算由
      证据、回应时机、诚信与舆情阈值按规则决定，处理得当能转危为机，失当则口碑受损。

  - id: fans
    title: 粉丝分层
    keywords: [粉丝, 铁粉, 路人粉, 黑粉, 分层, 脱粉]
    body: >-
      粉丝分为核心铁粉、路人粉与黑粉三层，由名气、品牌匹配度与受众认可派生。稳定人设扩大
      核心粉，争议与反转则会增加黑粉、流失路人粉。

  - id: relations
    title: 关系经营与表白
    keywords: [关系, 好感, 心动, 信任, 表白, 恋爱, 交往, 私下联系, 攻略]
    body: >-
      每位角色都可经营。"私下联系"回暖心情、提升好感/私人信任/心动，但有冷却与行动力消耗，
      长期冷落会让心情回落。普通角色好感与心动同时达标即可表白；少数固定角色需走多段情感线。

  - id: map
    title: 星城地图与出行
    keywords: [地图, 出行, 前往, 移动, 探索, 地点, 星城, 舆图, 石牌]
    body: >-
      通过舆图上的石牌点选前往相邻地点，出行消耗行动力与交通费并度过时日。未探索的地点需
      要先走到才会点亮。不同地点有各自的常驻人物、营业状态与可做的事。

  - id: houses
    title: 三大世家（谢·慕容·九）
    keywords: [世家, 谢家, 慕容家, 九家, 谢忱, 启星娱乐, 门阀, 势力, 世界观]
    body: >-
      星城水面之下由三大世家分踞：谢家坐拥娱乐与传媒帝国，慕容家执金融资本之牛耳，九家为最
      古老隐秘的政军望族。谢家现任家主谢忱二十三岁临危夺位，兼任顶级娱乐公司「启星娱乐」CEO——
      而这不过是他名下产业的一角，你所属的启星事务所即隶属其下。三家彼此联姻又相互制衡：谢忱之母
      出自慕容家，圈中多位名流的母族亦可追溯到这三个姓氏。名气与口碑积累到相当程度，才有机会被
      引见到这些真正的话事人面前。
