# ═══════════════ 娱乐圈生态内容池 (industry ContentPool) ═══════════════
# 公司名号、剧目名、代言品牌名——全部中文文案在此，引擎只按序号(index)取用。
# 引擎不认识这些名字，只生成「第几家公司 / 第几部戏 / 第几个代言」的数值与序号。

# 经纪公司：开局在 5~8 家中随机选取；每家自带声望基线(prestige 0-100)与一句简介。
# boss 为公司掌舵人（老板/总裁），确定性资料，仅展示、不参与数值结算。
companies:
  - name: 星辰文化
    prestige: 82
    blurb: 老牌综合娱乐集团，影视歌全线开花，捧红过一代天王天后。
    boss:
      name: 沈国栋
      title: 董事长
      age: 58
      style: 铁腕老派
      quote: 艺人是公司的招牌，招牌一旦砸了，谁也扶不起来。
      bio: 上世纪八十年代靠录像带发行起家，一手把星辰文化做成业内航母。人称「沈老爷」，赏罚分明，最恨艺人耍大牌，也最舍得为忠心的人砸资源。
  - name: 银河映画
    prestige: 74
    blurb: 以电影出品见长，戏路正、资源硬，签约门槛极高。
    boss:
      name: 陆敬深
      title: 总裁
      age: 52
      style: 挑剔完美主义
      quote: 我这里不缺红人，缺的是能留在银幕上的脸。
      bio: 电影世家出身，留洋学的制片。选人只看戏，眼光毒辣，被他签下的新人往往一部戏封神。脾气冷，片场却是出了名的护短。
  - name: 鎏金娱乐
    prestige: 68
    blurb: 商业运作的老手，代言与红毯资源冠绝业界。
    boss:
      name: 金培元
      title: 总裁
      age: 46
      style: 精明商人
      quote: 流量也好口碑也罢，最后都要能变成合同上的数字。
      bio: 广告代理商转行做经纪，把艺人当品牌运营的一把好手。谈判桌上滴水不漏，圈里都说「跟老金签约先数好自己几根手指」。
  - name: 清和经纪
    prestige: 61
    blurb: 学院派作风，专攻实力演员与音乐人的长线培养。
    boss:
      name: 谢文澜
      title: 掌门人
      age: 60
      style: 儒雅长者
      quote: 慢一点没关系，路要走得远，根要扎得深。
      bio: 音乐学院退下来的老教授，办公司像办学堂。不追热点、不炒绯闻，只信「十年磨一戏」。旗下艺人对他多是执弟子礼。
  - name: 潮汐传媒
    prestige: 55
    blurb: 新锐综艺工厂，擅长把新人迅速推上话题风口。
    boss:
      name: 邵潮生
      title: CEO
      age: 39
      style: 激进弄潮儿
      quote: 这个时代，先被看见的人才有资格谈实力。
      bio: 电视台综艺导演出身，最懂怎么造话题、抢版面。做事雷厉风行，敢赌敢砸，把一批默默无闻的新人一夜捧上热搜，也常因过度营销挨骂。
  - name: 未名星工场
    prestige: 47
    blurb: 主打偶像团体与练习生体系，粉丝经济玩得最溜。
    boss:
      name: 韩未名
      title: 总监
      age: 41
      style: 严苛教头
      quote: 舞台不相信眼泪，练不出来就换下一个。
      bio: 早年在海外做过偶像经纪，把整套练习生培养体系搬了回来。训练室里以严厉著称，却也真心把练习生当自家孩子，团体出道那天常躲在后台抹泪。
  - name: 长风文化
    prestige: 40
    blurb: 中小体量的踏实公司，靠稳定通告养一批中坚艺人。
    boss:
      name: 郑长风
      title: 老板
      age: 49
      style: 务实厚道
      quote: 我给不了你一步登天，但饿不着你，也不坑你。
      bio: 从跑通告的小经纪人做起，攒下这份家业。不玩虚的，最重情义，签约合同能少一条坑就少一条。艺人跳槽走了，逢年过节还会给他寄贺卡。
  - name: 拾光工作室
    prestige: 33
    blurb: 独立工作室，资源有限却给足艺人自由，圈内口碑不错。
    boss:
      name: 温拾光
      title: 主理人
      age: 35
      style: 理想主义者
      quote: 钱可以慢慢挣，作品得对得起自己。
      bio: 广告圈才女辞职单干，工作室开在老弄堂里。资源拼不过大公司，却肯为一个好本子推掉赚钱的通告。签她的艺人图的就是那份自在与体面。

