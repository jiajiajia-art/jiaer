# 年度奖项：开局即结算「当前得主」。引擎按 gender + metric 从艺人中挑最合适者落实到具体 NPC，
# 奖项名/类别文案只在此，引擎不写死中文。metric 对应用于排序的能力口径。
awards:
  - { ceremony: 白玉兰奖, category: 最佳女演员, gender: 女, metric: acting }
  - { ceremony: 白玉兰奖, category: 最佳男演员, gender: 男, metric: acting }
  - { ceremony: 白玉兰奖, category: 最佳女配角, gender: 女, metric: acting }
  - { ceremony: 白玉兰奖, category: 最佳男配角, gender: 男, metric: acting }
  - { ceremony: 金鹰奖, category: 最具人气女演员, gender: 女, metric: fame }
  - { ceremony: 金鹰奖, category: 最具人气男演员, gender: 男, metric: fame }
  - { ceremony: 金曲奖, category: 年度最佳女歌手, gender: 女, metric: singing }
  - { ceremony: 金曲奖, category: 年度最佳男歌手, gender: 男, metric: singing }

# 圈内动态：同行之间每周演化出的事件。引擎只挑「抽象关系类别(kind)+参与者」并抽签，
# 具体中文文案在此按 kind 提供多条模板；{a}=主角艺人名，{b}=另一位艺人名。
# 引擎绝不写死这些文案，渲染时用 pick % 模板数 稳定选中同一条。
starEvents:
  rivalry:
    - "{a} 与 {b} 因一部大制作的番位之争闹得沸沸扬扬，两家粉丝在论坛吵翻了天。"
    - "颁奖礼红毯上，{a} 与 {b} 擦肩而过却全程零交流，镜头扫过的冷场被媒体大做文章。"
    - "{a} 一句「有人靠资本堆流量」被指含沙射影，外界纷纷猜测是在回应 {b}。"
  romance:
    - "{a} 与 {b} 被拍到深夜同回一处公寓，恋情疑云再度升温，两方经纪公司均未回应。"
    - "有杂志爆出 {a} 与 {b} 已低调交往半年，配图里两人戴着同款情侣表。"
    - "{a} 在生日会上被 {b} 亲手送上蛋糕，甜蜜互动让「{a}{b}」的话题冲上热搜。"
  breakup:
    - "{a} 与旧爱 {b} 的往事被翻出，据传当年分手是因聚少离多，如今各自安好。"
    - "有小报重提 {a} 与 {b} 的那段情，称两人早已形同陌路，连合作都刻意避开。"
  collab:
    - "{a} 与 {b} 官宣搭档出演年度大戏，一正一反的对手戏未播先热。"
    - "{a} 与 {b} 合唱的主题曲上线即霸榜，粉丝直呼「梦幻联动」。"
    - "综艺里 {a} 与 {b} 组成临时搭档，默契十足的表现圈了一大波路人粉。"
  rise:
    - "新人 {a} 凭一部小成本剧一夜爆红，被业内点名是今年最大的黑马。"
    - "{a} 的一段舞台视频疯传，实力派新人的名号不胫而走，各家公司争相递本子。"
