      - { id: trymakeup, name: 试妆造体验, icon: "", energy: -8, money: -50, stat: zixin, statDelta: 3, desc: 央化妆间的师傅给你上个当季妆造，第一次看清"被精修"的自己。, msg: 你体验了一次专业妆造，镜子里的自己让你多了几分底气（自信 +3、行动力 -8、¥-50）。 }
  yuntai:
