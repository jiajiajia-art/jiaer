    desc: 浮光影视基地的摄影棚一座连着一座，轨道与灯架间藏着无数个成名的梦。西邻事务所，往北可达云台传媒城。
    items:
      - { id: scriptbag, name: 剧本资料袋, icon: "", desc: 摊在选角桌上的牛皮纸资料袋，里头是待定角色的分场剧本与人物小传。想接戏，得先找制片方把这些细节问清楚。, linksProjects: true }
      - { id: extrapass, name: 临时演员证, icon: "", desc: 群演进出片场的临时通行证。攥着它，你能在棚里多站一会儿，看看真正的剧组怎么运转。 }
    activities:
