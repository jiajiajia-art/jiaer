      - { id: readlines, name: 对着空棚念台词, icon: "", energy: -6, stress: 2, stat: koucai, statDelta: 3, desc: 趁收工没人，站在空棚里放开嗓子念一段独白，找镜头前的分寸。, msg: 你在空棚里反复念了段独白，台词的分寸拿捏得更稳了（口才 +3、压力 +2、行动力 -6）。 }
  cancan:
