      - { id: mockhost, name: 对着镜头练串场, icon: "", energy: -6, stress: 2, stat: koucai, statDelta: 3, desc: 借空档站上主持位，照着提词板练几遍串场，找综艺感。, msg: 你照着提词板练了几遍串场，口条顺了不少（口才 +3、压力 +2、行动力 -6）。 }
  dieyin:
