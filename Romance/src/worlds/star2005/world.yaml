# ═══════════════════════════════════════════════════════════════
#  星光2005 · 世界内容池 (ContentPool)
#  所有娱乐圈名称、地点、履历、门槛参数、按钮文案、年代设定都在此。
#  引擎 (mud.ts / logic.ts) 只做通用规则运算，不得内嵌中文映射或阈值。
# ═══════════════════════════════════════════════════════════════

# —— 年代与日历（②日推进将读取此处，先落地设定）——
calendar:
  eraName: 公元
  startYear: 2005
  startDate: "2005-01-03"      # 第 1 周周一
  careerWeeks: 104             # 生涯总周数（第104周末 = 2006-12-31）
  weekdayNames: [周一, 周二, 周三, 周四, 周五, 周六, 周日]
  monthLabel: "月"
  dayLabel: "日"

# —— 方向标签（MUD 出口）——
directions:
  n: 北
  s: 南
  e: 东
  w: 西
  ne: 东北
  nw: 西北
  se: 东南
  sw: 西南

# —— 城市通行（移动耗时/交通费公式参数；引擎只做图搜索，不写死数值）——
travel:
  minutesPerHop: 20            # 每跨越一段路程约需的分钟数（移动即令当日时刻流动）
  feePerHop: 20                # 每段路程的交通费（元，整数）
  energyPerHop: 6              # 每段路程消耗的行动力（点；跑得越远越累，形成资源闭环）
  dayStartMinute: 480          # 每天从 08:00 开始活动（当日时刻起点）
  dayEndMinute: 1380           # 到 23:00 天色已晚，宜歇息「度日」翻页
  carShop: fours               # 买车的地点（出行面板提示去这里买车）
  defaultMode: subway
  modes:                       # 交通方式（不声明则不启用交通系统，只显示「前往」）
    - { id: walk, label: 步行, fareMul: 0, timeMul: 2.4, note: "免费 · 最慢，顺便散散心" }
    - { id: bus, label: 公交, fareMul: 0.4, timeMul: 1.5, note: "便宜，但要等要挤" }
    - { id: subway, label: 地铁, fareMul: 0.7, timeMul: 0.9, note: "准点，性价比高" }
    - { id: taxi, label: 打车, fareMul: 1.8, timeMul: 0.7, note: "最快，也最贵" }
    - { id: drive, label: 自己开车, fareMul: 0, timeMul: 0.7, note: "开自己的车 · 免费又自在", ownCar: true }

# —— 指标显示名（生成门槛提示用；引擎不写中文）——
metricLabels:
  week: 周
  fame: 名气
  reputation: 口碑
  blackFans: 黑粉
  works: 作品
  looks: 容貌
  energy: 行动力
  stress: 压力
  stats.yanji: 演技
  stats.geyi: 歌艺
  stats.koucai: 口才
  stats.yitai: 仪态
  stats.donggan: 动感
  stats.tineng: 体能
  stats.caizhi: 才智
  stats.zixin: 自信

# —— 营业/开放状态文案（引擎按房间的 hours/openDays 与在场剧组推导状态键，中文只在此）——
roomStatus:
  open: 开放中
  closed: 今日休息
  busy: 拍摄中
  event: 活动进行中

# —— 房间：出口图 + 叙述文 + 物品/居家活动（对应 data.ts 的 LOCATIONS 地点）——
# 可选字段：hours(营业时段展示) · openDays(开放星期 1=周一…7=周日，缺省=每日)
#           tint(背景色调键 jade|coral|gold|ink|plum) · access(通行门槛 {requires,note})
rooms:
  apartment:
    exits: { s: street, w: park }
    tint: jade
    desc: 天光小区的小屋朝南，虽算不上宽敞，却被你收拾得干干净净。窗台上一盆绿萝正抽新芽。这里是你一个人的地方。楼下中庭梧桐成荫，街坊常在长椅上晒太阳；往南出小区门便是星桥商业街，往西是滨江公园。
    items:
      - { id: schedulebook, name: 日程本, icon: "", desc: 封皮磨得发白的横线日程本，密密麻麻记着这一周要跑的通告与试镜。翻开它就想起离出道还有多少天。 }
      - { id: greentea, name: 一盒枸杞茶, icon: "", desc: 母亲塞进行李的枸杞茶，说熬夜拍戏要养身子。喝一口，心里稍微踏实些。 }
      - { id: noticeboard, name: 小区公告栏, icon: "", desc: 贴着水电通知与寻猫启事的公告栏，边角压着几张琴行招生的传单。市井的暖意，都在这些琐碎里。 }
    # —— 居家活动：在家可点选的日常小事（增益/消耗全在此登记，引擎只按数值增减）——
    # 可选字段：energy/stress/fame(数值增减) · stat/statDelta(某项属性±) · requiresItem(需先拥有某物) · lockedMsg(缺物提示)
    activities:
      - { id: watchtv, name: 看电视, icon: "", energy: -4, stress: -10, fame: 1, desc: 窝在沙发里看一档娱乐节目，顺便瞄一眼同行都在忙些什么。, msg: 你窝在沙发里看了会儿电视，紧绷的神经松了松（压力 -10、行动力 -4、名气 +1）。 }
      - { id: rest, name: 好好休息, icon: "", energy: 40, stress: -12, desc: 拉上窗帘，什么也不想，踏踏实实睡一觉、发一会儿呆。, msg: 你在天光小区好好歇了一场，行动力与压力都缓了过来（行动力 +40、压力 -12）。 }
      - { id: readbook, name: 看书, icon: "", energy: -8, stress: 3, stat: caizhi, statDelta: 6, requiresItem: actingbook, lockedMsg: 你手边没有可读的书——先去星桥商业街的墨痕书店买一本吧。, desc: 就着台灯翻一本表演理论的书，字字都得琢磨，读完脑子涨涨的，却踏实。, msg: 你就着台灯读完一章表演理论，笔记记了满满一页（才智 +6、行动力 -8、压力 +3）。 }
      - { id: courtyardsit, name: 长椅上坐坐, icon: "", energy: 4, stress: -8, desc: 在中庭的长椅上坐一会儿，看孩子追跑、老人下棋，让脚步慢下来。, msg: 你在小区长椅上坐了会儿，晒着太阳看邻里家常，心里松快了些（压力 -8、行动力 +4）。 }
      - { id: chatneighbor, name: 和街坊唠家常, icon: "", energy: -3, stress: -5, stat: koucai, statDelta: 2, desc: 跟晾被单的阿姨、遛弯的大爷搭两句，市井的人情也是一种功课。, msg: 你和小区街坊唠了两句家常，嘴皮子和人缘都热络了些（口才 +2、压力 -5、行动力 -3）。 }
  street:
    exits: { n: apartment, e: cafe, w: gym, s: agency, ne: redcarpet, nw: bookstore, se: wardrobe, sw: academy }
    tint: gold
    intro: 你第一次真正站在星桥商业街的中央——霓虹漫过头顶，人流像一条不肯停的河。你忽然意识到，这座城不会为任何人放慢脚步，包括你。
    desc: 星桥商业街人来人往，霓虹与灯箱在暮色里次第亮起。这里是星城的十字路口——北回天光小区，东去咖啡馆，西往练习馆，南抵事务所，东北那栋气派的楼便是红毯会客厅。
    items:
      - { id: streetposter, name: 街边海报栏, icon: "", desc: 贴满新片与代言的巨幅海报，边角已被雨水泡皱。榜上有名的那几张脸，你还只能仰望。 }
    activities:
      - { id: streetsnack, name: 吃份街边小吃, icon: "", energy: 6, stress: -8, money: -15, desc: 街角那家糖油粑粑排着队，热气腾腾。犒劳一下连轴转的自己。, msg: 你就着夜风吃了份热乎的街边小吃，心情松快了些（压力 -8、行动力 +6、¥-15）。 }
      - { id: windowshop, name: 逛街淘搭配, icon: "", energy: -6, stress: -6, money: -80, stat: yitai, statDelta: 4, desc: 挨家挨店试穿、比价，把自己收拾得清爽入时，也顺带练了眼光。, msg: 你逛了一圈淘到几件合身的搭配，穿衣品味长进不少（仪态 +4、压力 -6、行动力 -6、¥-80）。 }
      - { id: streetsnap, name: 认真凹造型街拍, icon: "", energy: -8, fame: 4, stat: zixin, statDelta: 2, desc: 挑个有光的墙角，认真凹几组造型让路人拍——曝光是新人攒脸熟的笨办法。, msg: 你在街头认真凹了组造型，被路人拍了发上网，攒了点脸熟（名气 +4、自信 +2、行动力 -8）。 }
  wardrobe:
    exits: { nw: street, n: beauty }
    tint: coral
    hours: 10:00–21:00
    intro: 华裳时装屋的落地镜排成一列，衣架上垂着一整季的当红剪裁。你伸手抚过一件缎面礼服，指尖凉得发烫——原来站在镜头前的底气，也是这样一寸寸披挂上身的。
    desc: 华裳时装屋是星桥街最挑剔的一家买手店，从日常通勤到红毯战袍应有尽有。镜前多站一会儿，你便更懂得镜头想要什么。往西北可回商业街。
    items:
      - { id: galadress, name: 一袭高定礼服, icon: "", price: 260, desc: 挂在 C 位的高定礼服，剪裁利落、缎面流光。披上它出席晚宴，气场先赢三分——攒够身价的人才敢下手。 }
      - { id: styleboard, name: 当季搭配灵感墙, icon: "", desc: 贴满剪报与色卡的灵感墙，写着这一季的流行公式。免费翻看，权当练眼光。 }
    activities:
      - { id: fittry, name: 试搭一身行头, icon: "", energy: -6, stress: -4, stat: yitai, statDelta: 4, desc: 在落地镜前一件件试搭，找最衬自己的版型与配色，把镜头感穿在身上。, msg: 你在镜前试搭了大半天，对自己的版型和气场更有数了（仪态 +4、压力 -4、行动力 -6）。 }
      - { id: studystyle, name: 研读灵感墙, icon: "", energy: -5, stat: caizhi, statDelta: 3, desc: 对着灵感墙拆解当季流行的配色与廓形，把审美一点点补上来。, msg: 你把灵感墙的当季公式抄记了一遍，审美与品味长进不少（才智 +3、行动力 -5）。 }
  bookstore:
    exits: { se: street }
    tint: ink
    hours: 09:00–22:00
    intro: 墨痕书店的木门一推，纸张与油墨的旧气味扑面而来。窄窄的过道两侧顶到天花板的书架，把街市的喧嚣挡在了门外。你忽然想，成名的路太吵，偶尔钻进这样一格安静，也是给自己续命。
    desc: 墨痕书店藏在星桥商业街的西北角，一排排旧书架从地面顶到天花板，空气里浮着纸香。表演、声乐、传记，想补哪一课，这里大抵都找得到。往东南可回商业街。
    items:
      - { id: actingbook, name: 表演理论教材, icon: "", price: 120, desc: 一本被翻得起了毛边的表演理论教材，扉页有前主人密密麻麻的批注。买回家慢慢啃，才智会一点点涨上来。 }
      - { id: shelfnote, name: 书店留言墙, icon: "", desc: 收银台旁贴满便签的留言墙，写着淘书人的心事与暗号。免费翻看，权当歇脚。 }
    activities:
      - { id: browsebooks, name: 蹭读半本传记, icon: "", energy: -6, stress: -6, stat: caizhi, statDelta: 3, desc: 靠在书架间站着读半本明星传记，别人的浮沉里也藏着给自己的答案。, msg: 你在书架间蹭读了半本传记，心里那点浮躁沉淀了下来（才智 +3、压力 -6、行动力 -6）。 }
      - { id: pennote, name: 在留言墙写句话, icon: "", energy: -3, stress: -5, stat: zixin, statDelta: 2, desc: 撕张便签，写下此刻不敢对人说的心事，贴上那面墙。, msg: 你在留言墙上贴了张便签，把憋着的话交给了陌生人，轻松了一点（自信 +2、压力 -5、行动力 -3）。 }
  cafe:
    exits: { w: street, s: yuntai }
    tint: coral
    hours: 10:00–23:00
    intro: 推开白栀咖啡馆的玻璃门，风铃轻响。靠窗那桌坐着几个眼熟的圈内人，压低声音谈着什么——你第一次嗅到，很多机会不是在片场谈成的，而是在这样一杯咖啡的功夫里。
    desc: 白栀咖啡馆里飘着现磨的焦香，靠窗的位置最适合谈事情，也最适合发呆。往南走两条街就是云台传媒城。
    items:
      - { id: gossippaper, name: 一份娱乐周报, icon: "", desc: 摊在桌上的当期娱乐周报，头版是排行榜与绯闻。逐字读下去，能摸清这座城此刻在追捧谁。 }
    activities:
      - { id: pourover, name: 点一杯手冲, icon: "", energy: 8, stress: -10, money: -35, desc: 靠窗坐下，要一杯现磨手冲，看焦糖色慢慢晕开。这半小时只属于自己。, msg: 你在窗边慢慢喝完一杯手冲，紧绷的神经彻底松了（压力 -10、行动力 +8、¥-35）。 }
      - { id: eavesdrop, name: 旁听圈内闲谈, icon: "", energy: -5, stress: 2, stat: koucai, statDelta: 3, desc: 竖起耳朵听邻桌圈内人聊行情——很多门道不在片场，在这样一杯咖啡的功夫里。, msg: 你留神听了会儿邻桌的圈内闲谈，学了几句场面话与门道（口才 +3、压力 +2、行动力 -5）。 }
  gym:
    exits: { e: street, s: dieyin, n: fours }
    tint: jade
    hours: 06:00–23:00
    intro: 星栖练习馆的镜墙第一次把你整个人照了进去——发梢、站姿、连眼神里的怯意都无所遁形。把杆冰凉，地垫上还留着上一拨人的汗味。你深吸一口气：想被看见，得先熬得过这面镜子。
    desc: 星栖练习馆的镜墙映出一排排身影，把杆与地垫一尘不染。汗水与决心在这里发酵。往南是迭音音乐工坊。
    activities:
      - { id: stretch, name: 拉伸热身, icon: "", energy: -6, stress: -4, stat: tineng, statDelta: 3, desc: 趁没人占把杆，认真做一套拉伸热身，把僵住的身子唤醒。, msg: 你独自做完一套拉伸热身，身子松开了，也更耐练了（体能 +3、压力 -4、行动力 -6）。 }
      - { id: mirrorpose, name: 对镜练台风, icon: "", energy: -8, stat: yitai, statDelta: 4, desc: 一个人站在镜墙前，反复琢磨站姿、眼神与转身的角度。, msg: 你对着镜墙磨了半天台风，站姿和眼神都稳了不少（仪态 +4、行动力 -8）。 }
  fours:
    exits: { s: gym }
    tint: gold
    hours: 09:00–20:00
    intro: 星辉 4S 汽车城的落地玻璃亮得晃眼，一排排新车在射灯下泛着漆光。销售顾问迎上来递水递名片——你摸了摸口袋，忽然意识到：有辆自己的车，就再不必赶末班地铁、也不必在雨里等车了。
    desc: 星辉 4S 汽车城，展厅锃亮的新车与洽谈区的真皮沙发。想买车、置换或把旧车卖个残值，都在这儿谈。往南回星栖练习馆。
  agency:
    exits: { n: street, e: fuguang, w: cancan, s: theater }
    tint: ink
    hours: 周一至周五 09:00–19:00
    openDays: [1, 2, 3, 4, 5]
    intro: 启星事务所的旋转门第一次为你转动。前台抬眼打量了你一秒，公告栏上密密麻麻的通告条子在灯下泛白。你摸了摸口袋里的新人工牌——从这一刻起，你不再只是个做梦的女孩。
    desc: 启星事务所的前台永远亮着灯，公告栏上贴满了新人的通告与试镜条子。东边通往浮光影视基地，西边是璀璨广告中心。
    items:
      - { id: bulletinboard, name: 通告公告栏, icon: "", desc: 钉满彩色便签的公告栏，写着各家剧组、品牌、节目的招募条子。真正的机会得去对应公司当面找负责人谈。 }
      - { id: newbiebadge, name: 新人工牌, icon: "", desc: 启星发给你的新人工牌，塑封还带着毛边。挂上它，才算真正踏进了这个圈子。 }
    activities:
      - { id: readboard, name: 抄录通告条子, icon: "", energy: -5, stat: caizhi, statDelta: 3, desc: 站在公告栏前把新贴的招募条子一条条抄进本子，摸清行情该往哪儿使劲。, msg: 你把公告栏上新贴的条子抄了满满一页，行情心里有了数（才智 +3、行动力 -5）。 }
      - { id: frontdeskchat, name: 和前台唠两句, icon: "", energy: -4, stress: -5, stat: koucai, statDelta: 2, desc: 赖在前台边上跟老员工套近乎，八卦里往往藏着最新的风声。, msg: 你和前台老员工唠了两句，套出些圈里的新风声（口才 +2、压力 -5、行动力 -4）。 }
  redcarpet:
    exits: { sw: street, e: lounge, n: nightbar }
    tint: coral
    hours: 晚宴时段（受邀开放）
    access:
      note: 红毯会客厅只在名流晚宴时敞开——门口的迎宾扫了你一眼，你的口碑还不足以受邀入内。
      requires:
        - { metric: reputation, op: gte, value: 40, hint: 口碑≥40 方能受邀 }
    intro: 第一次踏上红毯会客厅的酒红长毯，水晶灯晃得你有些眩。四下的寒暄声、碰杯声里，每一句「久仰」背后都压着看不见的筹码。你站在门口，忽然懂了：这里不是终点，是另一场更凶险的开始。
    desc: 红毯会客厅铺着酒红长毯，水晶灯下觥筹交错，每一次寒暄背后都是资源的暗流。往西南可回商业街。
    activities:
      - { id: mingle, name: 端着酒杯周旋, icon: "", energy: -8, stress: 4, fame: 3, stat: koucai, statDelta: 3, desc: 端一杯香槟在人群里穿梭，一句"久仰"接一句"改天约"，社交场就是没有硝烟的战场。, msg: 你端着酒杯在名流间周旋了一晚，脸熟攒了、话术也练了，只是身心俱疲（口才 +3、名气 +3、压力 +4、行动力 -8）。 }
  fuguang:
    exits: { w: agency, n: yuntai, e: outdoorset, s: makeup }
    tint: plum
    hours: 08:00–22:00（拍摄日程为准）
