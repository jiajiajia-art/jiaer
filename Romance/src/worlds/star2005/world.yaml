      - { id: setgossip, name: 墙根听群演闲聊, icon: "", energy: -3, stress: -3, stat: caizhi, statDelta: 1, desc: 蹲到墙根和等戏的群演唠两句，哪个剧组缺人、哪个导演脾气差，一清二楚。, msg: 你在墙根听了一耳朵剧组八卦，对圈里的门道更清楚了（才智 +1、压力 -3、行动力 -3）。 }
  makeup:
