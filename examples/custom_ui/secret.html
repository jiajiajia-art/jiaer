<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农村动物逃脱（关卡版 / AI 生成）</title>
    <!-- 引入 js-yaml 库用于解析 YAML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #main-container {
            flex: 1;
            display: flex;
            position: relative;
        }

        canvas {
            flex: 1;
            cursor: crosshair;
            background-image: radial-gradient(#2d3748 1px, transparent 1px);
            background-size: 40px 40px;
            background-color: #1a202c;
        }

        #editor-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            display: none;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            padding: 40px;
            overflow-y: auto;
            z-index: 1000;
        }

        .editor-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-card {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: 10px; }

        textarea {
            width: 100%;
            height: 480px;
            background: #0f172a;
            color: #fbbf24;
            font-family: 'Cascadia Code', 'Courier New', monospace;
            padding: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            line-height: 1.5;
            resize: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-secondary { background: #475569; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1100;
        }

        #msg-box {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 2000;
        }

        #msg-box.show { opacity: 1; top: 70px; }

        /* 关卡完成与生成中的覆盖层 */
        .overlay {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55); z-index: 1900; color: #fff;
        }
        .overlay.open { display: flex; }
        .overlay-card { background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; min-width: 280px; max-width: 90vw; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
        .overlay-title { font-weight: 800; margin: 0 0 8px; }
        .overlay-sub { opacity: .8; margin: 0 0 16px; font-size: 14px; }
        .row { display:flex; gap:10px; align-items:center; }

        .help-text { font-size: 13px; color: #94a3b8; margin-bottom: 10px; line-height: 1.6; }
        code { color: var(--accent); background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="msg-box">提示消息</div>

    <div id="controls">
        <button class="btn btn-secondary" onclick="toggleEditor()">⚙️ 农村逃脱配置</button>
        <button class="btn btn-primary" onclick="resetGame()">🔄 重置</button>
        <button class="btn btn-primary" id="btn-gen">🚀 生成关卡</button>
    </div>

    <div id="main-container">
        <canvas id="game-canvas"></canvas>

        <div id="editor-overlay">
            <div class="editor-column">
                <div class="config-card">
                    <h3>YAML 农场配置</h3>
                    <p class="help-text">
                        修改农场元素和逻辑。让小猪通过吃饱、找到钥匙、打开围栏获得自由。也可以直接点击右上角“生成关卡”，由 LLM 自动生成新的解谜配置。
                    </p>
                    <textarea id="yaml-editor" spellcheck="false"></textarea>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button class="btn btn-primary" onclick="applyConfig()">💾 部署农场</button>
                        <button class="btn btn-secondary" onclick="toggleEditor()">❌ 返回</button>
                    </div>
                </div>
            </div>
            
            <div class="editor-column">
                <div class="config-card">
                    <h3>解谜链条</h3>
                    <div class="help-text">
                        • <b>点击草堆</b>: 寻找遗失的玉米。<br>
                        • <b>喂食小猪</b>: 玉米 + 小猪 = 快乐的小猪。<br>
                        • <b>搜寻泥地</b>: 点击泥地获得老钥匙。<br>
                        • <b>最终合成</b>: 快乐小猪 + 老钥匙 + 围栏门 = 逃出农场。
                    </div>
                </div>
                <div class="config-card">
                    <h3>当前状态</h3>
                    <p id="status-info" style="color: var(--accent); font-weight: bold;"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 关卡完成弹窗 -->
    <div class="overlay" id="level-done">
      <div class="overlay-card">
        <h3 class="overlay-title" id="done-title">🎉 过关啦</h3>
        <p class="overlay-sub" id="done-sub">点击下一关，继续挑战更复杂的谜题。</p>
        <div class="row">
          <button class="btn btn-primary" id="btn-next">➡️ 下一关</button>
          <button class="btn btn-secondary" id="btn-close-done">先等等</button>
        </div>
      </div>
    </div>

    <!-- 生成关卡加载 -->
    <div class="overlay" id="level-loading">
      <div class="overlay-card">
        <h3 class="overlay-title">🧠 正在生成关卡…</h3>
        <p class="overlay-sub" id="loading-sub">可能需要几秒钟，请稍候。</p>
        <div class="row"><span id="llm-hint" style="opacity:.75;font-size:12px;">使用平台提供的 LLM 接口生成 YAML 配置</span></div>
      </div>
    </div>

    <script>
        // 农村动物逃脱 YAML 配置
        const initialYaml = `
elements:
  haystack:
    name: 干燥草堆
    color: "#eab308"
    icon: "🌾"
  corn:
    name: 金色玉米
    color: "#fbbf24"
    icon: "🌽"
  pig:
    name: 饥饿的小猪
    color: "#f472b6"
    icon: "🐷"
  happy_pig:
    name: 快乐的小猪
    color: "#ff85c0"
    icon: "🐖"
  mud:
    name: 湿润泥地
    color: "#78350f"
    icon: "💩"
  key:
    name: 锈蚀钥匙
    color: "#94a3b8"
    icon: "🗝️"
  fence:
    name: 农场围栏
    color: "#451a03"
    icon: "🚧"
  freedom_pig:
    name: 奔向自由
    color: "#4ade80"
    icon: "🏃‍♂️💨"

clickActions:
  haystack:
    spawn: corn
    msg: "在草堆里翻到了一个新鲜的玉米！"
    limit: 2
  mud:
    spawn: key
    msg: "在泥巴里踩到了一个硬物，是把旧钥匙！"
    limit: 1

recipes:
  - a: pig
    b: corn
    result: happy_pig
    msg: "小猪吃饱了，现在它有足够的力气逃跑了！"
  - a: happy_pig
    b: key
    result: happy_pig
    msg: "小猪衔住了钥匙！"
  - a: happy_pig
    b: fence
    result: freedom_pig
    msg: "小猪用钥匙打开了围栏，冲向了大自然！"

initialState:
  - { type: haystack, x: 150, y: 200 }
  - { type: pig, x: 300, y: 400 }
  - { type: mud, x: 500, y: 250 }
  - { type: fence, x: 650, y: 500 }

winCondition: freedom_pig
`;

        let GAME_CONFIG = {};
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const yamlEditor = document.getElementById('yaml-editor');
        const editorOverlay = document.getElementById('editor-overlay');
        const msgBox = document.getElementById('msg-box');

        let elements = [];
        let draggingElement = null;
        let isGameOver = false;
        let currentLevel = 1;
        let awaitingAI = false;
        let aiReady = false;
        let appInfo = { appId: null, sessionId: null, version: null };
        let pendingResolve = null, pendingReject = null;
        let mouseDownPos = { x: 0, y: 0 };

        function init() {
            window.addEventListener('resize', resize);
            resize();
            yamlEditor.value = initialYaml.trim();
            applyConfig(false);

            // 绑定关卡按钮
            document.getElementById('btn-gen')?.addEventListener('click', () => {
                generateLevel(currentLevel).catch(err => alert('生成失败：' + err));
            });
            document.getElementById('btn-next')?.addEventListener('click', () => {
                closeLevelDone();
                generateLevel(currentLevel + 1).catch(err => alert('生成失败：' + err));
            });
            document.getElementById('btn-close-done')?.addEventListener('click', closeLevelDone);

            // 建立与宿主的 AI 通道
            try { setupAIChannel(); } catch (e) { console.warn('[AI] setup failed', e); }
            
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('dblclick', autoLayout);

            animate();
        }

        function toggleEditor() {
            const isOpen = editorOverlay.style.display === 'grid';
            editorOverlay.style.display = isOpen ? 'none' : 'grid';
        }

        function applyConfig(closeEditor = true) {
            try {
                const newConfig = jsyaml.load(yamlEditor.value);
                if(!newConfig || !newConfig.elements) throw new Error("YAML 数据不完整");
                GAME_CONFIG = normalizeConfig(newConfig);
                resetGame();
                if(closeEditor) {
                    toggleEditor();
                    showMessage("🌾 农场已更新！");
                }
            } catch (e) {
                alert("YAML 解析失败:\n" + e.message);
            }
        }

        function normalizeConfig(cfg){
            // 确保必要字段存在，并为缺省坐标自动布点
            cfg = cfg || {};
            cfg.elements = cfg.elements || {};
            cfg.initialState = Array.isArray(cfg.initialState) ? cfg.initialState : [];
            // 给没有坐标的元素补齐
            const W = window.innerWidth, H = window.innerHeight;
            cfg.initialState = cfg.initialState.map((it, i) => {
                const nx = (typeof it.x === 'number') ? it.x : 160 + (i%6)*140;
                const ny = (typeof it.y === 'number') ? it.y : 160 + Math.floor(i/6)*140;
                return { ...it, x: Math.max(80, Math.min(W-80, nx)), y: Math.max(80, Math.min(H-80, ny)) };
            });
            return cfg;
        }

        function resetGame() {
            elements = [];
            isGameOver = false;
            if(!GAME_CONFIG.initialState) return;

            GAME_CONFIG.initialState.forEach(item => {
                elements.push(createInstance(item.type, item.x, item.y));
            });
            document.getElementById('status-info').innerText = `关卡：第 ${currentLevel} 关 | 目标：${GAME_CONFIG.winCondition}`;
        }

        function createInstance(type, x, y) {
            const config = GAME_CONFIG.elements[type];
            return {
                id: Math.random().toString(36).substr(2, 9),
                type: type,
                x: x, y: y, targetX: x, targetY: y,
                radius: 45,
                clickCount: 0,
                ...config
            };
        }

        function showMessage(text) {
            msgBox.innerText = text;
            msgBox.classList.add('show');
            setTimeout(() => msgBox.classList.remove('show'), 3000);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function onMouseDown(e) {
            if (isGameOver) return;
            const x = e.clientX;
            const y = e.clientY;
            mouseDownPos = { x, y };

            for (let i = elements.length - 1; i >= 0; i--) {
                const el = elements[i];
                if (Math.hypot(el.x - x, el.y - y) < el.radius) {
                    draggingElement = el;
                    elements.splice(i, 1);
                    elements.push(draggingElement);
                    break;
                }
            }
        }

        function onMouseMove(e) {
            if (draggingElement) {
                draggingElement.targetX = e.clientX;
                draggingElement.targetY = e.clientY;
            }
        }

        function onMouseUp(e) {
            if (!draggingElement) return;

            const movedDist = Math.hypot(e.clientX - mouseDownPos.x, e.clientY - mouseDownPos.y);

            if (movedDist < 5) {
                handleElementClick(draggingElement);
            } else {
                checkCollisions(draggingElement);
            }
            draggingElement = null;
        }

        function handleElementClick(el) {
            const action = GAME_CONFIG.clickActions?.[el.type];
            if (action) {
                if (action.limit && el.clickCount >= action.limit) {
                    showMessage(`这里什么都没有了。`);
                    return;
                }

                el.clickCount++;
                const spawnType = action.spawn;
                if (GAME_CONFIG.elements[spawnType]) {
                    const angle = Math.random() * Math.PI * 2;
                    const nx = el.x + Math.cos(angle) * 90;
                    const ny = el.y + Math.sin(angle) * 90;
                    elements.push(createInstance(spawnType, nx, ny));
                    showMessage(action.msg || `发现了 ${GAME_CONFIG.elements[spawnType].name}`);
                }
            }
        }

        function checkCollisions(el1) {
            for (let i = 0; i < elements.length; i++) {
                const el2 = elements[i];
                if (el1.id === el2.id) continue;

                if (Math.hypot(el1.x - el2.x, el1.y - el2.y) < el1.radius + el2.radius) {
                    const recipe = GAME_CONFIG.recipes?.find(r => 
                        (r.a === el1.type && r.b === el2.type) || (r.b === el1.type && r.a === el2.type)
                    );

                    if (recipe) {
                        const midX = (el1.x + el2.x) / 2;
                        const midY = (el1.y + el2.y) / 2;
                        
                        elements = elements.filter(e => e.id !== el1.id && e.id !== el2.id);
                        elements.push(createInstance(recipe.result, midX, midY));

                        showMessage(recipe.msg);
                        if (recipe.result === GAME_CONFIG.winCondition) {
                            isGameOver = true;
                            setTimeout(() => { showLevelDone(); }, 600);
                        }
                        return;
                    }
                }
            }
        }

        function autoLayout() {
            elements.forEach((el, i) => {
                el.targetX = 120 + (i % 5) * 140;
                el.targetY = 120 + Math.floor(i / 5) * 140;
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            elements.forEach(el => {
                el.x += (el.targetX - el.x) * 0.15;
                el.y += (el.targetY - el.y) * 0.15;

                ctx.save();
                ctx.translate(el.x, el.y);
                
                // 农场风背景光圈
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, el.radius + 15);
                grad.addColorStop(0, el.color + '22');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, el.radius + 15, 0, Math.PI*2); ctx.fill();

                // 交互提示
                if (GAME_CONFIG.clickActions?.[el.type] && el.clickCount < (GAME_CONFIG.clickActions[el.type].limit || 99)) {
                    ctx.beginPath();
                    ctx.arc(0, 0, el.radius + 6, 0, Math.PI*2);
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.beginPath();
                ctx.arc(0, 0, el.radius, 0, Math.PI*2);
                ctx.fillStyle = '#2d3748';
                ctx.strokeStyle = el.color;
                ctx.lineWidth = 3;
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = '34px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(el.icon, 0, -4);

                ctx.font = 'bold 13px "Microsoft YaHei"';
                ctx.fillStyle = el.color;
                ctx.fillText(el.name, 0, 32);
                
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        // ---------- AI 关卡生成 ----------
        function setupAIChannel(){
            // UI -> Host：告知可用
            window.parent && window.parent.postMessage({ type: 'ai:init' }, '*');
            window.addEventListener('message', (e) => {
                const data = e.data || {};
                if (data.type === 'ai:ready') {
                    aiReady = true;
                    appInfo = { appId: data.payload.appId, sessionId: data.payload.sessionId, version: data.payload.version };
                    console.log('[AI] ready', appInfo);
                } else if (data.type === 'ai:message') {
                    if (pendingResolve) { try { pendingResolve(data.payload.finalText || ''); } finally { clearPending(); } }
                } else if (data.type === 'ai:request-error') {
                    if (pendingReject) { try { pendingReject(new Error(data.payload?.message || 'request-error')); } finally { clearPending(); } }
                }
            });
        }

        function clearPending(){ awaitingAI = false; pendingResolve = null; pendingReject = null; }

        function askLLM(prompt){
            if (!aiReady) return Promise.reject(new Error('AI 通道尚未就绪'));
            if (awaitingAI) return Promise.reject(new Error('有未完成的请求'));
            awaitingAI = true;
            showLoading(`正在生成第 ${currentLevel} 关…`);
            return new Promise((resolve, reject) => {
                pendingResolve = (txt)=>{ hideLoading(); resolve(txt); };
                pendingReject = (err)=>{ hideLoading(); reject(err); };
                window.parent.postMessage({ type:'ai:send', payload: { text: prompt, stream: false } }, '*');
            });
        }

        function buildPrompt(level){
            const difficulty = level <= 2 ? '简单' : (level <= 4 ? '中等' : '困难');
            return `你是密室/解谜关卡设计师。生成一个 YAML 配置（仅输出 YAML），用于一个“密室逃脱”小游戏第${level}关，难度${difficulty}。\n`+
`要求：\n`+
`- 严格使用如下字段：elements, clickActions, recipes, initialState, winCondition。\n`+
`- elements: 至多 8 个，键为标识符（小写+下划线），每个含 name(中文短语), color(十六进制), icon(emoji)。\n`+
`- clickActions: 零到多个，key 为元素标识，包含 spawn(生成另一个元素标识), msg(中文短提示), limit(可点击次数)。\n`+
`- recipes: 3-6 条，每条 a,b,result,msg；通过拖拽 a 到 b 生成 result。\n`+
`- initialState: 4-8 项，每项 { type, x, y }，x,y 在 100-1000 范围内的整数。\n`+
`- winCondition: 取值为 elements 中某个最终产物标识。\n`+
`- 主题可变化但保持“密室/角色/工具/障碍”风格；用新颖组合增加层次感。\n`+
`- 仅输出 YAML，不要解释。`;
        }

        async function generateLevel(level){
            currentLevel = level;
            const prompt = buildPrompt(level);
            const txt = await askLLM(prompt);
            // 尝试剥离代码块
            const yaml = String(txt).replace(/^```yaml\s*|^```\s*|```\s*$/gm, '').trim();
            let cfg;
            try { cfg = jsyaml.load(yaml); } catch (e) { throw new Error('解析失败：'+e.message); }
            if (!cfg || !cfg.elements || !cfg.recipes || !cfg.initialState || !cfg.winCondition) {
                throw new Error('返回缺少必要字段');
            }
            // 更新编辑器并应用
            yamlEditor.value = yaml;
            GAME_CONFIG = normalizeConfig(cfg);
            resetGame();
            showMessage(`第 ${currentLevel} 关已生成`);
        }

        function showLevelDone(){
            const ov = document.getElementById('level-done');
            const t = document.getElementById('done-title');
            const s = document.getElementById('done-sub');
            if(t) t.textContent = `🎉 第 ${currentLevel} 关完成！`;
            if(s) s.textContent = '点击“下一关”，我会用 LLM 生成更复杂的一关。';
            ov && ov.classList.add('open');
        }
        function closeLevelDone(){ const ov = document.getElementById('level-done'); ov && ov.classList.remove('open'); }
        function showLoading(text){ const ov = document.getElementById('level-loading'); const sub = document.getElementById('loading-sub'); if(sub) sub.textContent = text||'正在生成…'; ov && ov.classList.add('open'); }
        function hideLoading(){ const ov = document.getElementById('level-loading'); ov && ov.classList.remove('open'); }

        init();
    </script>
</body>
</html>
